name: Export double-tap firmware
on:
  push:
    branches: [codex/aa-double-tap-scroll-20261009]
    paths: [.github/workflows/export-double-tap.yml]
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aa-double-tap-scroll-20261009
      - name: Verify the legacy build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/murongqiaochu-hub/zmk-config-9981-pro/actions/runs/37877489401'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == '9743a177c92360be5c40cf5f5f412ccb0209526a'
          assert run['head_branch'] == 'codex/aa-double-tap-scroll-20261009'
          PY
      - name: Download the successful firmware build
        uses: actions/download-artifact@v4
        with:
          name: firmware
          run-id: 37877489401
          github-token: ${{ github.token }}
          path: firmware-delivery/9743a17
      - name: Validate and record UF2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct, hashlib, json
          root = pathlib.Path('firmware-delivery/9743a17')
          files = list(root.rglob('*.uf2'))
          assert len(files) == 1, files
          p = files[0]
          b = p.read_bytes()
          assert len(b) > 0 and len(b) % 512 == 0
          blocks = len(b) // 512
          addresses = []
          for i in range(blocks):
              block = b[i*512:(i+1)*512]
              m0,m1,flags,addr,size,num,total,family = struct.unpack_from('<8I',block)
              assert (m0,m1) == (0x0A324655,0x9E5D5157)
              assert struct.unpack_from('<I',block,508)[0] == 0x0AB16F30
              assert flags == 0x2000 and family == 0xADA52840
              assert num == i and total == blocks and size == 256
              assert addr % 256 == 0 and 0x1000 <= addr and addr + size <= 0xD4000
              addresses.append(addr)
          assert addresses[0] == 0x1000
          assert all(y-x == 256 for x,y in zip(addresses,addresses[1:]))
          sha = hashlib.sha256(b).hexdigest()
          (root/'SHA256SUMS').write_text(sha+'  '+str(p.relative_to(root))+'\n')
          (root/'validation.json').write_text(json.dumps({'source_commit':'9743a177c92360be5c40cf5f5f412ccb0209526a','source_run':37877489401,'file':str(p.relative_to(root)),'bytes':len(b),'blocks':blocks,'family':'0xADA52840','sha256':sha,'device_tested':False},indent=2)+'\n')
          print('UF2 verified:', len(b), 'bytes,', blocks, 'blocks, SHA256', sha)
          PY
      - name: Preserve verified firmware on this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware-delivery/9743a17
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: preserve verified double-tap UF2 [skip ci]'
          git push origin HEAD:codex/aa-double-tap-scroll-20261009
