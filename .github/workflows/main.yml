name: Build and verify firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile real drivers with host mocks and run regressions
        run: python3 tests/run_host_tests.py
  build:
    needs: regression
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
  deliver:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dim-indicators-independent-pointer-20261011'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's compiled UF2
        uses: actions/download-artifact@v4
        with:
          name: firmware
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: firmware-delivery/${{ github.sha }}
      - name: Verify application boundaries and record provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
        run: python3 tools/verify_firmware.py "firmware-delivery/$SOURCE_SHA" --commit "$SOURCE_SHA" --run-id "$SOURCE_RUN"
      - name: Preserve verified UF2 on this feature branch only
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "firmware-delivery/$SOURCE_SHA"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: preserve verified low-light firmware [skip ci]'
          git push origin HEAD:codex/dim-indicators-independent-pointer-20261011
